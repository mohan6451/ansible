  tasks:
  - name: installing using advanced loop
    ansible.builtin.package:
      name: "{{ name }}" 
      state: "{{ state }}"
    loop:
    - { name: "nginx", state: "absent" }
    - { name: "mysql", state: "present" }
    - { name: "zip", state: "present" }