---
- name: OS Patching and Web Server Configuration
  hosts: webservers
  become: yes  # Run all tasks with sudo privileges
  serial: 1    # Rolling update: updates servers ONE by ONE to avoid downtime

  vars:
    nginx_port: 80
    server_admin: "devops-team@company.com"

  tasks:

    # ==========================================
    # 1. OS PATCHING & UPDATES
    # ==========================================
    - name: Ensure all OS packages are updated to the latest version
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Check if a reboot is required after system updates
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    # ==========================================
    # 2. SOFTWARE CONFIGURATION
    # ==========================================
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Apply custom Nginx configuration from template
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Nginx  # Triggers the handler below IF the file actually changes

    - name: Ensure Nginx service is started and enabled on boot
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes

    # ==========================================
    # 3. SAFE SYSTEM REBOOT (IF REQUIRED)
    # ==========================================
    - name: Reboot the server safely if kernel updates require it
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible due to kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: reboot_required_file.stat.exists

  # ==========================================
  # HANDLERS (Runs at the very end only if notified)
  # ==========================================
  handlers:
    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
